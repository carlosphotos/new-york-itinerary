<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Recorrido a pie por Midtown</title>
  <desc id="desc">Ruta desde Bryant Park hasta Rockefeller Center pasando por Grand Central y St. Patrick's Cathedral.</desc>
  <rect width="720" height="420" fill="#eef3f5"/>
  <g stroke="#d1dadd" stroke-width="2">
    <path d="M0 80h720M0 160h720M0 240h720M0 320h720"/>
    <path d="M90 0v420M210 0v420M330 0v420M450 0v420M570 0v420M660 0v420"/>
  </g>
  <g fill="#cddfe7" opacity=".8">
    <rect x="10" y="90" width="70" height="60"/><rect x="100" y="170" width="100" height="60"/><rect x="340" y="250" width="100" height="60"/><rect x="580" y="90" width="70" height="60"/>
  </g>
  <path d="M168 329 C235 330 270 290 322 244 S430 190 485 166 S522 122 546 90" fill="none" stroke="#7899aa" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 16"/>
  <g fill="#2c3133" stroke="#f8f5ef" stroke-width="6">
