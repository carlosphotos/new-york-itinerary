<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="New York">
  <meta name="description" content="Guía privada del viaje a Nueva York · September 10–16, 2026">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <title>New York · 2026</title>
</head>
<body>
  <div class="app-shell">
    <header class="masthead">
      <p class="eyebrow">A PRIVATE CITY GUIDE</p>
      <button class="install-button" id="installButton" hidden>Instalar</button>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-route="home" class="nav-item active" aria-label="Hoy">
        <span class="nav-icon" aria-hidden="true">⌁</span><span>Hoy</span>
      </button>
      <button data-route="itinerary" class="nav-item" aria-label="Itinerario">
        <span class="nav-icon" aria-hidden="true">☷</span><span>Itinerario</span>
      </button>
      <button data-route="places" class="nav-item" aria-label="Lugares">
        <span class="nav-icon pin" aria-hidden="true">◇</span><span>Lugares</span>
      </button>
      <button data-route="info" class="nav-item" aria-label="Info">
        <span class="nav-icon" aria-hidden="true">i</span><span>Info</span>
      </button>
    </nav>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
