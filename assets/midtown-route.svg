    <text x="250" y="228" font-size="19" font-weight="600">Grand Central</text>
    <text x="385" y="150" font-size="19" font-weight="600">St. Patrick’s</text>
    <text x="500" y="58" font-size="19" font-weight="600">Rockefeller</text>
    <text x="28" y="38" font-size="13" letter-spacing="3" fill="#7899aa">MIDTOWN · WALKING ROUTE</text>
  </g>
